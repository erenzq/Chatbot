<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🚗 Log Chatbot</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h2 {
            text-align: center;
            padding: 15px;
            background: #020617;
            margin: 0;
            border-bottom: 1px solid #1e293b;
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 70%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #2563eb;
            align-self: flex-end;
        }

        .bot {
            background: #1e293b;
            align-self: flex-start;
        }

        #controls {
            padding: 10px;
            background: #020617;
            border-top: 1px solid #1e293b;
        }

        #upload-area {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        #input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        input[type="file"] {
            color: white;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .status {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<h2>🚗 Log Chatbot</h2>

<div id="chat"></div>

<div id="controls">

    <!-- Upload -->
    <div id="upload-area">
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">📁 Upload Logs</button>
    </div>

    <!-- Chat Input -->
    <div id="input-area">
        <input
                type="text"
                id="question"
                placeholder="Stelle eine Frage..."
                onkeypress="handleKey(event)"
        >
        <button onclick="ask()">Senden</button>
    </div>

    <div class="status" id="status"></div>

</div>

<script>
    let chatHistory = [];

    function addMessage(text, className) {
        const chat = document.getElementById("chat");

        const msg = document.createElement("div");
        msg.className = "message " + className;
        msg.innerText = text;

        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(text) {
        document.getElementById("status").innerText = text;
    }

    function handleKey(event) {
        if (event.key === "Enter") {
            ask();
        }
    }

    async function uploadFile() {
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];

        if (!file) {
            alert("Bitte Datei auswählen");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        setStatus("📤 Lade Logs hoch...");

        try {
            const res = await fetch("http://127.0.0.1:8008/upload_logs", {
                method: "POST",
                body: formData
            });

            const data = await res.json();

            addMessage("📁 " + data.message, "bot");
            setStatus("✅ Upload erfolgreich");

        } catch (error) {
            addMessage("❌ Upload fehlgeschlagen", "bot");
            setStatus("❌ Fehler beim Upload");
        }
    }

    async function ask() {
        const input = document.getElementById("question");
        const question = input.value;

        if (!question) return;

        addMessage(question, "user");

        chatHistory.push({
            role: "user",
            content: question
        });

        input.value = "";

        const chat = document.getElementById("chat");

        const msg = document.createElement("div");
        msg.className = "message bot";
        msg.innerText = "🤖 ";
        chat.appendChild(msg);

        setStatus("🤖 Denke nach...");

        try {
            const res = await fetch("http://127.0.0.1:8008/ask_ai_stream", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: question,
                    history: chatHistory
                })
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();

            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                fullText += chunk;

                msg.innerText = "🤖 " + fullText;
            }

            chatHistory.push({
                role: "assistant",
                content: fullText
            });

            setStatus("✅ Antwort fertig");

        } catch (error) {
            msg.innerText = "❌ Fehler beim Streaming";
            setStatus("❌ Fehler");
        }
    }

    window.onload = () => {
        addMessage("🤖 Hallo! Lade Logs hoch und stell mir Fragen 🚀", "bot");
    };
</script>

</body>
</html>
